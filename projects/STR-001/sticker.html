<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Print | STR-001 Digital Passport</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-navy: #0F2138;
            --color-orange: #FF6B1A;
            --color-gray-light: #F8FAFD;
            --color-border: #E2E8F0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ECEFF1;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        /* Physical Sticker layout: Standard 80mm x 80mm square sticker */
        .sticker-card {
            width: 80mm;
            height: 80mm;
            background-color: #FFFFFF;
            border: 1px dashed #B0BEC5; /* represents cut line */
            padding: 5mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Brand Header */
        .sticker-header {
            text-align: center;
            width: 100%;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5mm;
            margin-bottom: 0.5mm;
        }

        .brand-logo {
            height: 6mm;
            width: auto;
        }

        .brand-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.0mm;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--color-orange);
            text-transform: uppercase;
        }

        .passport-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.1mm;
            font-weight: 700;
            color: var(--color-navy);
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        /* QR Code Container - Uses vector SVG for infinite print resolution */
        .qr-container {
            width: 38mm;
            height: 38mm;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--color-border);
            border-radius: 4mm;
            padding: 2mm;
            background-color: var(--color-gray-light);
        }

        .qr-img {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Footer Metadata */
        .sticker-footer {
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1mm;
        }

        .project-badge {
            background-color: var(--color-navy);
            color: #FFFFFF;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.0mm;
            font-weight: 700;
            padding: 0.8mm 3mm;
            border-radius: 10mm;
            letter-spacing: 0.05em;
            display: inline-block;
        }

        .scan-instruction {
            font-size: 2.3mm;
            font-weight: 600;
            color: var(--color-navy);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        /* Print Instructions panel (visible only on screen) */
        .print-panel {
            width: 80mm;
            background-color: #37474F;
            color: #ECEFF1;
            padding: 4mm;
            border-radius: 4mm;
            margin-top: 5mm;
            font-size: 3mm;
            line-height: 1.4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .print-btn {
            background-color: var(--color-orange);
            color: #FFFFFF;
            border: none;
            padding: 2mm 4mm;
            border-radius: 2mm;
            font-weight: 700;
            font-size: 3.2mm;
            cursor: pointer;
            width: 100%;
            margin-top: 3mm;
            transition: background 0.2s;
        }

        .print-btn:hover {
            background-color: #E65100;
        }

        /* Print Media Stylesheet */
        @media print {
            body {
                background-color: #FFFFFF !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }

            .sticker-card {
                position: absolute;
                top: 0;
                left: 0;
                border: none !important; /* hide cut line border when printing */
                box-shadow: none !important;
                page-break-inside: avoid;
            }

            .print-panel {
                display: none !important; /* hide helper tools on printer output */
            }
        }
    </style>
</head>
<body>

    <!-- Sticker Layout -->
    <div class="sticker-card">
        
        <!-- Header -->
        <header class="sticker-header">
            <div class="brand-row">
                <!-- Relative path pointing to the main website logo (assumes hosted structure) -->
                <img src="../../assets/images/logo.PNG" alt="Cloud Tech Logo" class="brand-logo">
                <span class="brand-name">Cloud Tech</span>
            </div>
            <h1 class="passport-title">Digital Electrical Passport</h1>
        </header>

        <!-- QR Code (Links to https://www.cloudtech.mk/projects/STR-001/) -->
        <div class="qr-container">
            <img src="cloudtech-STR-001-qr.svg" alt="STR-001 QR Code" class="qr-img">
        </div>

        <!-- Footer -->
        <footer class="sticker-footer">
            <div class="project-badge">Project ID: STR-001</div>
            <p class="scan-instruction">Scan for electrical documentation</p>
        </footer>

    </div>

    <!-- Admin Helper Panel (Hidden on print) -->
    <div class="print-panel">
        <h3 style="font-family: 'Space Grotesk', sans-serif; font-size: 3.5mm; margin-bottom: 2mm; color: #FFF;">Print Instructions</h3>
        <p>This layout is calibrated to exactly <b>80mm x 80mm</b>.</p>
        <p style="margin-top: 1mm;">In print dialog settings:</p>
        <ul style="margin-left: 4mm; margin-top: 1mm;">
            <li>Scale: <b>100%</b> (do not use "Fit to page")</li>
            <li>Margins: <b>None</b></li>
            <li>Background Graphics: <b>Enabled</b></li>
        </ul>
        <button class="print-btn" onclick="window.print()">Print Sticker</button>
    </div>

</body>
</html>
